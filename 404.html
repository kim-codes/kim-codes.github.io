<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kimcdoes 404</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/styles.css">
    <style>
        /* =========================================================
   404 PAGE
   ========================================================= */

        .error-page {
            min-height: calc(100vh - 220px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 60px 24px 100px;

            color: #242220;
        }

        .error-content {
            width: 100%;
            max-width: 620px;

            text-align: center;
        }


        /* Illustration */

        .error-illustration {
            display: block;

            width: min(100%, 460px);
            height: auto;

            margin: 0 auto 30px;
        }


        /* Copy */

        .error-content h1 {
            margin: 0 0 16px;

            font-family: 'Inter', sans-serif;
            font-size: clamp(26px, 3vw, 36px);
            font-weight: 600;
            letter-spacing: -0.035em;
            line-height: 1.15;
        }

        .error-content h1 span {
            font-weight: 400;
        }

        .error-copy {
            margin: 0 auto;

            font-family: 'Inter', sans-serif;
            font-size: 16px;
            line-height: 1.7;

            color: #77716b;
        }


        /* Back home */

        .error-home-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-top: 32px;

            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: #77716b;

            text-decoration: none;

            transition: color 0.2s ease;
        }

        .error-home-link:hover {
            color: #242220;
        }

        .error-home-link .hand-arrow {
            transition: transform 0.2s ease;
        }

        .error-home-link:hover .hand-arrow {
            transform: translateX(-4px);
        }


        /* =========================================================
   MOBILE
   ========================================================= */

        @media (max-width: 700px) {

            .error-page {
                min-height: calc(100vh - 160px);
                padding: 40px 22px 70px;
            }

            .error-content {
                max-width: 430px;
            }

            .error-illustration {
                width: min(100%, 340px);
                margin-bottom: 26px;
            }

            .error-content h1 {
                font-size: 27px;
            }

            .error-copy {
                font-size: 15px;
                line-height: 1.65;
            }

        }
    </style>

</head>

<body>

    <header>

        <a href="/" class="logo">
            <img src="/assets/img/kimcodes-gummy-twist.webp" alt="kimcodes">
        </a>

        <nav>
            <ul>
                <li><a href="/constants.html">Constants</a></li>
                <li><a href="/craft.html">Craft</a></li>
                <li><a href="/reflections.html">Reflections</a></li>
                <li><a href="/footprints.html">Footprints</a></li>
                <li><a href="/contact.html">Say Hello</a></li>
            </ul>
        </nav>

    </header>

    <main class="error-page">

        <section class="error-content">

            <img src="/assets/img/404-robot.png" alt="404 error with a small unplugged robot" class="error-illustration">

            <h1>Oops... this page isn't here <span>(yet).</span></h1>

            <p class="error-copy">
                But curiosity is always in progress.<br>
                There are plenty of other things to discover.
            </p>

            <a href="/" class="error-home-link" id="error-back-link">

                <svg class="hand-arrow hand-arrow-back" viewBox="0 0 40 20" width="32" height="16" aria-hidden="true">

                    <path d="M38,16 Q24,14 6,8 M12,4 L5,8 L10,14" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                    </path>

                </svg>

                <span>back to home</span>

            </a>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 Kim Codes</p>

    </footer>

    <script>
        const backLink = document.getElementById('error-back-link');
        const backText = backLink.querySelector('span');

        // Check whether the visitor came from another page on the site
        if (document.referrer) {
            try {
                const previousPage = new URL(document.referrer);

                if (previousPage.origin === window.location.origin) {
                    backText.textContent = 'go back';

                    backLink.addEventListener('click', function (event) {
                        event.preventDefault();
                        history.back();
                    });
                }
            } catch (error) {
                // else keep the default "back to home" link
            }
        }
    </script>

</body>

</html>
</body>
