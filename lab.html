<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kimcodes</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">

    <style>
        main {
            max-width: 920px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .lab-hero {
            max-width: 700px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            text-align: center;
        }

        .lab-hero h2 {
            font-size: 2rem;
        }

        .lab-list {
            max-width: 600px;
            border-top: 1px solid var(--line);
            margin-bottom: 56px;
        }

        .lab-item {
            display: grid;
            grid-template-columns: 40px 1fr 24px;
            gap: 20px;
            align-items: center;

            padding: 28px 0;

            border-bottom: 1px solid var(--line);

            color: var(--ink);
            text-decoration: none;
        }

        .lab-number {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--muted);
        }

        .lab-label {
            margin-bottom: 5px;

            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .lab-content h2 {
            margin: 0 0 4px;

            font-family: 'Space Grotesk', sans-serif;
            font-size: 26px;
            font-weight: 600;
        }

        .lab-content p {
            margin: 0;

            font-size: 15px;
            color: var(--muted);
        }

        .lab-arrow {
            font-size: 20px;
            color: var(--accent);
            transition: transform .2s ease;
        }

        .lab-item:hover .lab-arrow {
            transform: translateX(4px);
        }

        @media (max-width: 700px) {

            main {
                padding: 0 20px;
            }

            .lab-intro {
                margin-bottom: 36px;
            }

            .lab-item {
                grid-template-columns: 28px 1fr 20px;
                gap: 14px;
                padding: 24px 0;
            }

            .lab-content h2 {
                font-size: 23px;
            }

        }
    </style>

</head>

<body>

    <header>

        <a href="/" class="logo">
            <img src="assets/img/kimcodes-gummy-twist.webp" alt="kimcodes">
        </a>

        <nav>
            <ul> <!-- constants, rabbit holes, experiments, connections, reflections, breadcrumbs -->
                <li><a href="/constants.html">Constants</a></li>
                <li><a href="/craft.html">Craft</a></li>
                <li><a href="/reflections.html">Reflections</a></li>
                <li><a href="/footprints.html">Footprints</a></li>
                <li><a href="/contact.html">Say Hello</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <div class="lab-hero">
            <h2> Idea Lab </h2>
        </div>

        <div class="lab-list">

            <a href="studio.html" class="lab-item">
                <div class="lab-number">01</div>

                <div class="lab-content">
                    <div class="lab-label">Interactive Lab</div>
                    <h2>Vector Search</h2>
                    <p>A small experiment in how meaning becomes searchable..</p>
                </div>

                <div class="lab-arrow">→</div>
            </a>

            <a href="dashboard.html" class="lab-item">
                <div class="lab-number">02</div>

                <div class="lab-content">
                    <div class="lab-label">Interactive lab</div>
                    <h2>Program Pulse</h2>
                    <p>Bringing together signals.</p>
                </div>

                <div class="lab-arrow">→</div>
            </a>

        </div>

        <a href="craft.html" class="text-link">
            <span>←</span> Back to Craft
        </a>

    </main>

    </main>

    <footer>

        <p>&copy; 2026 Kim Codes</p>

    </footer>

</body>

</html>
